<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctor Schedule — Aurora Medical Center</title>
    <meta
      name="description"
      content="Weekly schedule of attending doctors. Name, title, hours, and room."
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #102531;
        --ink-2: #2a3a44;
        --ink-3: #6b7a83;
        --bg: #f3eee2;
        --paper: #ffffff;
        --teal: #0e7c7b;
        --coral: #ff5b3a;
        --amber: #f6b745;
        --indigo: #5b5fb2;
        --line: rgba(16, 37, 49, 0.12);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .mono {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }

      /* ───── PAGE FRAME ───── */
      .stand {
        max-width: 1280px;
        margin: 0 auto;
        padding: 48px 32px 48px;
      }

      /* ───── TITLE ───── */
      .title {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 24px;
        padding-bottom: 18px;
        border-bottom: 1.5px solid var(--ink);
        margin-bottom: 28px;
      }
      .title .mark {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .title .mark svg {
        width: 44px;
        height: 44px;
      }
      .title .mark .name {
        font-size: 13px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .title .mark .clinic {
        font-size: 15px;
        font-weight: 600;
        margin-top: 2px;
        letter-spacing: 0.02em;
      }
      .title h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .title .week {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        color: var(--ink-3);
        text-transform: uppercase;
        text-align: right;
      }
      .title .week b {
        display: block;
        color: var(--ink);
        font-size: 15px;
        letter-spacing: 0.08em;
        margin-top: 2px;
      }

      /* ───── CARDS GRID ───── */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      @media (max-width: 980px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: var(--radius);
        padding: 18px 18px 14px;
        position: relative;
        display: grid;
        grid-template-columns: 56px 1fr auto;
        column-gap: 14px;
        row-gap: 12px;
        align-items: start;
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        background: var(--accent, var(--teal));
        border-radius: var(--radius) 0 0 var(--radius);
      }
      .card .avatar {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--accent, var(--teal));
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.04em;
        grid-row: 1;
      }
      .card .who {
        min-width: 0;
        grid-row: 1;
      }
      .card .name {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.005em;
      }
      .card .title-line {
        margin-top: 4px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
      .card .room {
        align-self: start;
        grid-row: 1;
        display: inline-grid;
        grid-template-rows: auto auto;
        gap: 2px;
        text-align: right;
        padding: 6px 10px;
        border: 1.5px solid var(--accent, var(--teal));
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent, var(--teal)) 8%, #fff);
        min-width: 78px;
      }
      .card .room .label {
        font-size: 9px;
        letter-spacing: 0.22em;
        color: var(--accent, var(--teal));
        text-transform: uppercase;
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
      }
      .card .room .num {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        color: var(--accent, var(--teal));
        line-height: 1;
      }
      .card .room .floor {
        font-size: 10px;
        color: var(--ink-3);
        letter-spacing: 0.1em;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
      }

      .schedule {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        padding-top: 12px;
        border-top: 1px dashed var(--line);
      }
      .schedule .day {
        text-align: center;
        padding: 6px 2px 7px;
        border-radius: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        line-height: 1.1;
        color: var(--ink-3);
      }
      .schedule .day b {
        display: block;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--ink-2);
        margin-bottom: 3px;
      }
      .schedule .day.work {
        background: color-mix(in srgb, var(--accent, var(--teal)) 14%, #fff);
        color: var(--accent, var(--teal));
      }
      .schedule .day.work b {
        color: var(--accent, var(--teal));
      }
      .schedule .day.off {
        color: var(--ink-3);
      }

      footer.note {
        margin-top: 28px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--ink-3);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      /* ───── PRINT ───── */
      @media print {
        body {
          background: #fff;
        }
        .stand {
          padding: 16px;
        }
        .card {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main class="stand">
      <section class="title">
        <div class="mark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="g1" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#f6b745" />
                <stop offset="0.55" stop-color="#ff5b3a" />
                <stop offset="1" stop-color="#0e7c7b" />
              </linearGradient>
            </defs>
            <circle cx="32" cy="36" r="22" fill="url(#g1)" />
            <path d="M10 50 Q32 22 54 50" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" />
            <rect x="29.5" y="14" width="5" height="14" rx="1.2" fill="#fff" />
            <rect x="25" y="18.5" width="14" height="5" rx="1.2" fill="#fff" />
          </svg>
          <div>
            <div class="name">Aurora · Est 2014</div>
            <div class="clinic">Aurora Medical Center</div>
          </div>
        </div>
        <h1>Doctor Schedule</h1>
        <div class="week">
          Week of
          <b id="w-range">19 — 25 May 2026</b>
        </div>
      </section>

      <section class="grid" id="cards-host"></section>

      <footer class="note">
        <div id="f-updated">Updated: 20 May 2026</div>
        <div>All times local · 24-hour format</div>
      </footer>
    </main>

    <!--
      ════════════════════════════════════════════════
       STAND DATA  ──  Edit this block to update the
       schedule. Each doctor needs: name, title, room,
       floor and weekly hours. The grid re-renders on
       page load.
      ════════════════════════════════════════════════
    -->
    <script>
      const STAND_DATA = {
        clinic: { name: "Aurora Medical Center" },
        weekRange: "19 — 25 May 2026",
        updated: "20 May 2026",
        doctors: [
          {
            name: "Dr. Eleanor Park",
            title: "Cardiologist",
            room: 203,
            floor: 2,
            accent: "#0e7c7b",
            week: { mon: "09:00–13:00", tue: "—", wed: "09:00–13:00", thu: "—", fri: "09:00–13:00", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Hiro Tanaka",
            title: "Pediatrician",
            room: 105,
            floor: 1,
            accent: "#c8553d",
            week: { mon: "10:00–16:00", tue: "—", wed: "10:00–16:00", thu: "—", fri: "10:00–16:00", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Sofia Reyes",
            title: "Dermatologist",
            room: 211,
            floor: 2,
            accent: "#5b5fb2",
            week: { mon: "—", tue: "14:00–18:00", wed: "14:00–18:00", thu: "14:00–18:00", fri: "—", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Marcus Chen",
            title: "Neurologist",
            room: 312,
            floor: 3,
            accent: "#0e7c7b",
            week: { mon: "08:00–12:00", tue: "08:00–12:00", wed: "08:00–12:00", thu: "08:00–12:00", fri: "08:00–12:00", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Anya Volkov",
            title: "Family Physician",
            room: 102,
            floor: 1,
            accent: "#c8553d",
            week: { mon: "08:00–18:00", tue: "08:00–18:00", wed: "08:00–18:00", thu: "08:00–18:00", fri: "08:00–18:00", sat: "10:00–14:00", sun: "—" },
          },
          {
            name: "Dr. Liam O'Connor",
            title: "Orthopedic Surgeon",
            room: 305,
            floor: 3,
            accent: "#5b5fb2",
            week: { mon: "13:00–17:00", tue: "13:00–17:00", wed: "—", thu: "—", fri: "13:00–17:00", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Yara Nasser",
            title: "Ophthalmologist",
            room: 217,
            floor: 2,
            accent: "#0e7c7b",
            week: { mon: "09:00–13:00", tue: "—", wed: "09:00–13:00", thu: "—", fri: "09:00–13:00", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Adaeze Okoye",
            title: "Endocrinologist",
            room: 320,
            floor: 3,
            accent: "#c8553d",
            week: { mon: "—", tue: "10:00–16:00", wed: "10:00–16:00", thu: "10:00–16:00", fri: "—", sat: "—", sun: "—" },
          },
          {
            name: "Dr. Noah Bennett",
            title: "General Surgeon",
            room: 208,
            floor: 2,
            accent: "#5b5fb2",
            week: { mon: "07:30–11:30", tue: "07:30–11:30", wed: "—", thu: "07:30–11:30", fri: "—", sat: "—", sun: "—" },
          },
        ],
      };

      // ════════════════════════════════════════════════
      //  RENDER
      // ════════════════════════════════════════════════
      const DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      const DAY_LABELS = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

      function initials(name) {
        return name
          .replace(/Dr\.?\s*/i, "")
          .split(/\s+/)
          .map((w) => w[0])
          .filter(Boolean)
          .slice(0, 2)
          .join("")
          .toUpperCase();
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>\"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      }

      function render() {
        document.getElementById("w-range").textContent =
          STAND_DATA.weekRange;
        document.getElementById(
          "f-updated"
        ).textContent = `Updated: ${STAND_DATA.updated}`;

        const host = document.getElementById("cards-host");
        host.innerHTML = STAND_DATA.doctors
          .map((d) => {
            const week = DAYS.map((day, i) => {
              const hours = d.week[day] || "—";
              const cls = hours !== "—" ? "day work" : "day off";
              return `<div class="${cls}"><b>${DAY_LABELS[i]}</b>${escapeHtml(
                hours
              )}</div>`;
            }).join("");
            return `
              <article class="card" style="--accent:${d.accent}">
                <div class="avatar">${initials(d.name)}</div>
                <div class="who">
                  <div class="name">${escapeHtml(d.name)}</div>
                  <div class="title-line">${escapeHtml(d.title)}</div>
                </div>
                <div class="room" aria-label="Room ${d.room}, floor ${d.floor}">
                  <div class="label">Room</div>
                  <div class="num">${d.room}</div>
                  <div class="floor">Floor ${d.floor}</div>
                </div>
                <div class="schedule">${week}</div>
              </article>
            `;
          })
          .join("");
      }

      document.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
