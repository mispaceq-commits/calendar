<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctor Schedule — Aurora Medical Center</title>
    <meta
      name="description"
      content="Printable static information stand: weekly schedule of attending doctors."
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        ════════════════════════════════════════════════════
         A3 PORTRAIT PRINT POSTER  ──  297 × 420 mm
         Designed to render 1:1 on paper. Open in a browser
         and print: A3, portrait, no scaling, no headers.
        ════════════════════════════════════════════════════
      */
      @page {
        size: A3 portrait;
        margin: 0;
      }

      :root {
        --ink:    #142231;
        --ink-2:  #324354;
        --ink-3:  #707f8b;
        --paper:  #f4ead6;
        --paper-2:#ecdcb6;
        --rule:   #142231;
        --accent: #c4513a;
        --gold:   #b48043;
        --moss:   #4a705a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: #b9a98a;
        color: var(--ink);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-feature-settings: "tnum", "ss01";
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: start center;
        padding: 24px 16px 32px;
      }

      /* The poster itself — fixed A3 portrait dimensions */
      .poster {
        width: 297mm;
        height: 420mm;
        background: var(--paper);
        position: relative;
        overflow: hidden;
        color: var(--ink);
        box-shadow: 0 20px 50px -20px rgba(0,0,0,0.45),
                    0 8px 14px -8px rgba(0,0,0,0.25);
        font-size: 11pt;
      }

      /* Subtle paper grain made from two overlaid gradients */
      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 80% at 0% 0%, rgba(180,128,67,0.05), transparent 60%),
          radial-gradient(120% 80% at 100% 100%, rgba(20,34,49,0.05), transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      /* Outer rule */
      .frame {
        position: absolute;
        inset: 10mm;
        border: 0.6mm solid var(--ink);
        z-index: 1;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 1.6mm;
        border: 0.2mm solid var(--ink);
      }

      .content {
        position: absolute;
        inset: 17mm;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 7mm;
        z-index: 2;
      }

      /* ───── HEAD STRIP ───── */
      .head {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8mm;
        padding-bottom: 5mm;
        border-bottom: 0.4mm solid var(--ink);
      }
      .head .left {
        display: flex;
        align-items: center;
        gap: 4mm;
      }
      .head .left svg.mark {
        width: 16mm;
        height: 16mm;
        flex: 0 0 16mm;
      }
      .head .left .who {
        font-family: "IBM Plex Mono", monospace;
        font-size: 8pt;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--ink-3);
        line-height: 1.4;
      }
      .head .left .who b {
        display: block;
        color: var(--ink);
        font-family: "DM Serif Display", serif;
        font-weight: 400;
        font-size: 14pt;
        letter-spacing: 0;
        text-transform: none;
        margin-top: 1mm;
        line-height: 1;
      }
      .head .center {
        text-align: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 8pt;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .head .center b {
        display: block;
        color: var(--ink);
        font-weight: 500;
        font-size: 9.5pt;
        letter-spacing: 0.16em;
        margin-top: 1mm;
      }
      .head .right {
        text-align: right;
        font-family: "IBM Plex Mono", monospace;
        font-size: 8pt;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-3);
        line-height: 1.4;
      }
      .head .right b {
        display: block;
        color: var(--ink);
        font-weight: 500;
        font-size: 11pt;
        letter-spacing: 0.14em;
        margin-top: 1mm;
      }

      /* ───── TITLE ───── */
      .title {
        text-align: center;
        padding: 4mm 0 6mm;
      }
      .title .pre {
        font-family: "IBM Plex Mono", monospace;
        font-size: 9pt;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .title h1 {
        margin: 2mm 0 0;
        font-family: "DM Serif Display", serif;
        font-weight: 400;
        font-size: 64pt;
        letter-spacing: -0.01em;
        line-height: 0.95;
        color: var(--ink);
      }
      .title h1 em {
        font-style: italic;
        color: var(--accent);
      }
      .title .ornament {
        display: inline-flex;
        align-items: center;
        gap: 4mm;
        margin-top: 4mm;
        color: var(--ink-3);
        font-family: "IBM Plex Mono", monospace;
        font-size: 8pt;
        letter-spacing: 0.5em;
        text-transform: uppercase;
      }
      .title .ornament::before,
      .title .ornament::after {
        content: "";
        width: 28mm;
        height: 0.3mm;
        background: var(--ink);
      }

      /* ───── TABLE OF DOCTORS ───── */
      .table {
        position: relative;
      }
      .table .hdr {
        display: grid;
        grid-template-columns: 12mm 2.6fr 1.6fr 20mm repeat(7, 1fr);
        column-gap: 2.4mm;
        align-items: end;
        padding: 0 2mm 3mm;
        border-bottom: 0.4mm solid var(--ink);
        font-family: "IBM Plex Mono", monospace;
        font-size: 7.5pt;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .table .hdr .ctr { text-align: center; }
      .row {
        display: grid;
        grid-template-columns: 12mm 2.6fr 1.6fr 20mm repeat(7, 1fr);
        column-gap: 2.4mm;
        align-items: center;
        padding: 5.5mm 2mm;
        border-bottom: 0.2mm dashed rgba(20,34,49,0.25);
      }
      .row:last-child {
        border-bottom: 0.4mm solid var(--ink);
      }

      .row .num {
        font-family: "IBM Plex Mono", monospace;
        font-size: 16pt;
        font-weight: 500;
        color: var(--gold);
        letter-spacing: 0.04em;
      }
      .name-cell {
        display: grid;
        grid-template-columns: 11mm 1fr;
        gap: 3mm;
        align-items: center;
      }
      .name-cell .tag {
        width: 11mm;
        height: 11mm;
        background: var(--accent);
        color: var(--paper);
        display: grid;
        place-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 11pt;
        letter-spacing: 0.04em;
      }
      .name-cell .who .name {
        font-family: "DM Serif Display", serif;
        font-size: 13pt;
        line-height: 1.05;
        white-space: nowrap;
      }
      .name-cell .who .sub {
        font-family: "IBM Plex Mono", monospace;
        font-size: 7pt;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        margin-top: 1.5mm;
      }
      .title-cell {
        font-family: "Inter", sans-serif;
        font-size: 11pt;
        font-weight: 500;
        line-height: 1.15;
      }
      .title-cell .floor {
        font-family: "IBM Plex Mono", monospace;
        font-size: 7pt;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        margin-top: 1.5mm;
      }
      .room-cell {
        text-align: center;
      }
      .room-cell .num {
        font-family: "IBM Plex Mono", monospace;
        font-size: 22pt;
        font-weight: 500;
        color: var(--ink);
        letter-spacing: 0.04em;
        line-height: 1;
      }
      .room-cell .floor {
        font-family: "IBM Plex Mono", monospace;
        font-size: 7pt;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        margin-top: 1mm;
      }
      .day {
        text-align: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10pt;
        line-height: 1.1;
        color: var(--ink);
        font-weight: 500;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .day.off {
        color: var(--ink-3);
        font-weight: 400;
      }

      /* ───── BOTTOM FLOOR-NAV STRIP ───── */
      .footstrip {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 6mm;
        align-items: end;
        padding-top: 5mm;
        border-top: 0.4mm solid var(--ink);
      }
      .floor-card {
        font-family: "IBM Plex Mono", monospace;
        font-size: 8pt;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--ink-3);
        line-height: 1.4;
      }
      .floor-card b {
        display: block;
        color: var(--ink);
        font-size: 9.5pt;
        letter-spacing: 0.12em;
        margin-bottom: 2mm;
      }
      .floor-card svg.plan {
        display: block;
        width: 100%;
        height: 24mm;
        margin-bottom: 2mm;
      }
      .ident {
        text-align: right;
        font-family: "IBM Plex Mono", monospace;
        font-size: 7.5pt;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-3);
        line-height: 1.5;
      }
      .ident b {
        display: block;
        color: var(--ink);
        font-family: "DM Serif Display", serif;
        font-weight: 400;
        font-size: 13pt;
        letter-spacing: 0;
        text-transform: none;
        margin-bottom: 1.5mm;
      }

      /* ───── SCREEN PREVIEW ───── */
      @media (max-width: 1200px) {
        body { padding: 12px 0; }
        .poster {
          transform: scale(0.62);
          transform-origin: top center;
          margin-bottom: -38vh;
        }
      }

      /* ───── PRINT ───── */
      @media print {
        html, body { background: #fff; padding: 0; }
        body { display: block; }
        .poster {
          box-shadow: none;
          width: 297mm;
          height: 420mm;
          transform: none;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <article class="poster">
      <div class="frame"></div>

      <div class="content">
        <!-- ─── HEAD ─── -->
        <header class="head">
          <div class="left">
            <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0" stop-color="#b48043" />
                  <stop offset="0.55" stop-color="#c4513a" />
                  <stop offset="1" stop-color="#142231" />
                </linearGradient>
              </defs>
              <circle cx="32" cy="36" r="22" fill="url(#aurora)" />
              <path d="M10 50 Q32 22 54 50" stroke="#f4ead6" stroke-width="2.6" fill="none" stroke-linecap="round" />
              <rect x="29.5" y="14" width="5" height="14" rx="1" fill="#f4ead6" />
              <rect x="25" y="18.5" width="14" height="5" rx="1" fill="#f4ead6" />
            </svg>
            <div class="who">
              Est. 2014<b>Aurora Medical Center</b>Outpatient · Floors 1 – 3
            </div>
          </div>
          <div class="center">
            Information Stand · No. 02
            <b>For patients and visitors</b>
          </div>
          <div class="right">
            Week of<b>19 — 25 May 2026</b>
          </div>
        </header>

        <!-- ─── TITLE ─── -->
        <div class="title">
          <div class="pre">Today's attending physicians</div>
          <h1>Doctor <em>schedule</em></h1>
          <div class="ornament">Floors&nbsp;·&nbsp;Rooms&nbsp;·&nbsp;Hours</div>
        </div>

        <!-- ─── TABLE ─── -->
        <div class="table" id="table-host"></div>

        <!-- ─── FOOTER STRIP ─── -->
        <footer class="footstrip" id="foot-host"></footer>
      </div>
    </article>

    <!--
      ════════════════════════════════════════════════════
       STAND DATA  ──  Edit this block to refresh the
       poster for the next week. The table and the floor
       cards re-render on page load from one source.
      ════════════════════════════════════════════════════
    -->
    <script>
      const STAND_DATA = {
        clinic: { name: "Aurora Medical Center" },
        weekRange: "19 — 25 May 2026",
        boardId: "AMC-02 / 24-2026",
        doctors: [
          { name: "Dr. Eleanor Park",  title: "Cardiologist",       room: 203, floor: 2, week: { mon: "09:00–13:00", tue: "—", wed: "09:00–13:00", thu: "—", fri: "09:00–13:00", sat: "—", sun: "—" } },
          { name: "Dr. Hiro Tanaka",   title: "Pediatrician",       room: 105, floor: 1, week: { mon: "10:00–16:00", tue: "—", wed: "10:00–16:00", thu: "—", fri: "10:00–16:00", sat: "—", sun: "—" } },
          { name: "Dr. Sofia Reyes",   title: "Dermatologist",      room: 211, floor: 2, week: { mon: "—", tue: "14:00–18:00", wed: "14:00–18:00", thu: "14:00–18:00", fri: "—", sat: "—", sun: "—" } },
          { name: "Dr. Marcus Chen",   title: "Neurologist",        room: 312, floor: 3, week: { mon: "08:00–12:00", tue: "08:00–12:00", wed: "08:00–12:00", thu: "08:00–12:00", fri: "08:00–12:00", sat: "—", sun: "—" } },
          { name: "Dr. Anya Volkov",   title: "Family Physician",   room: 102, floor: 1, week: { mon: "08:00–18:00", tue: "08:00–18:00", wed: "08:00–18:00", thu: "08:00–18:00", fri: "08:00–18:00", sat: "10:00–14:00", sun: "—" } },
          { name: "Dr. Liam O'Connor", title: "Orthopedic Surgeon", room: 305, floor: 3, week: { mon: "13:00–17:00", tue: "13:00–17:00", wed: "—", thu: "—", fri: "13:00–17:00", sat: "—", sun: "—" } },
          { name: "Dr. Yara Nasser",   title: "Ophthalmologist",    room: 217, floor: 2, week: { mon: "09:00–13:00", tue: "—", wed: "09:00–13:00", thu: "—", fri: "09:00–13:00", sat: "—", sun: "—" } },
          { name: "Dr. Adaeze Okoye",  title: "Endocrinologist",    room: 320, floor: 3, week: { mon: "—", tue: "10:00–16:00", wed: "10:00–16:00", thu: "10:00–16:00", fri: "—", sat: "—", sun: "—" } },
          { name: "Dr. Noah Bennett",  title: "General Surgeon",    room: 208, floor: 2, week: { mon: "07:30–11:30", tue: "07:30–11:30", wed: "—", thu: "07:30–11:30", fri: "—", sat: "—", sun: "—" } },
        ],
        floors: [
          { id: 1, name: "Ground Floor", subtitle: "Family care · Pharmacy", rooms: [101,102,103,105,107,110,111,112,115] },
          { id: 2, name: "Second Floor", subtitle: "Specialists · Imaging",  rooms: [201,203,205,208,211,213,217,220,222] },
          { id: 3, name: "Third Floor",  subtitle: "Neurology · Therapy",    rooms: [301,303,305,308,312,315,318,320,325] },
        ],
      };

      const DAYS = ["mon","tue","wed","thu","fri","sat","sun"];
      const DAY_LABELS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];

      function initials(name) {
        return name.replace(/Dr\.?\s*/i, "")
          .split(/\s+/).map(w => w[0]).filter(Boolean).slice(0,2).join("").toUpperCase();
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>\"']/g, c => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        })[c]);
      }
      function pad2(n) { return String(n).padStart(2, "0"); }

      function renderTable() {
        const host = document.getElementById("table-host");
        const headerHtml = `
          <div class="hdr">
            <div class="ctr">№</div>
            <div>Doctor</div>
            <div>Title</div>
            <div class="ctr">Room</div>
            ${DAY_LABELS.map(d => `<div class="ctr">${d}</div>`).join("")}
          </div>`;
        // Compress "09:00–13:00" to a compact "9–13" (drop :00),
        // keep half-hours ("7:30–11:30").
        const compact = (t) => {
          const m = t.match(/^(\d{1,2}):(\d{2})$/);
          if (!m) return t;
          const [, h, mm] = m;
          return mm === "00" ? String(parseInt(h, 10)) : `${parseInt(h, 10)}:${mm}`;
        };
        const rows = STAND_DATA.doctors.map((d, idx) => {
          const days = DAYS.map((day) => {
            const h = d.week[day] || "—";
            if (h === "—") return `<div class="day off">—</div>`;
            const m = h.match(/(\d{1,2}:\d{2})[^\d](\d{1,2}:\d{2})/);
            if (!m) return `<div class="day">${escapeHtml(h)}</div>`;
            return `<div class="day">${compact(m[1])}–${compact(m[2])}</div>`;
          }).join("");
          return `
            <div class="row">
              <div class="num">${pad2(idx + 1)}</div>
              <div class="name-cell">
                <div class="tag">${initials(d.name)}</div>
                <div class="who">
                  <div class="name">${escapeHtml(d.name)}</div>
                  <div class="sub">ID · MD-${pad2(idx + 1)}${pad2(d.room)}</div>
                </div>
              </div>
              <div class="title-cell">
                ${escapeHtml(d.title)}
                <div class="floor">Floor ${d.floor} · Wing ${d.floor === 1 ? "A" : d.floor === 2 ? "B" : "C"}</div>
              </div>
              <div class="room-cell">
                <div class="num">${d.room}</div>
                <div class="floor">Floor ${d.floor}</div>
              </div>
              ${days}
            </div>`;
        }).join("");
        host.innerHTML = headerHtml + rows;
      }

      function renderFooter() {
        const host = document.getElementById("foot-host");
        const cards = STAND_DATA.floors.map(f => {
          // Mini static SVG floor plan: 3×3 grid of room rectangles
          const W = 100, H = 60, cols = 3, rows = 3, gap = 4, pad = 3;
          const cellW = (W - pad*2 - gap*(cols-1)) / cols;
          const cellH = (H - pad*2 - gap*(rows-1)) / rows;
          const cells = f.rooms.slice(0, 9).map((rn, i) => {
            const r = Math.floor(i/cols), c = i%cols;
            const x = pad + c*(cellW + gap);
            const y = pad + r*(cellH + gap);
            const doc = STAND_DATA.doctors.find(d => d.room === rn);
            const fill = doc ? "#c4513a" : "rgba(20,34,49,0.06)";
            const txt = doc ? "#f4ead6" : "#142231";
            return `
              <rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" rx="1.2" fill="${fill}" stroke="#142231" stroke-width="0.3"/>
              <text x="${x + cellW/2}" y="${y + cellH/2 + 0.4}" font-family="IBM Plex Mono" font-size="3.4" font-weight="500" fill="${txt}" text-anchor="middle" dominant-baseline="middle">${rn}</text>
            `;
          }).join("");
          return `
            <div class="floor-card">
              <b>Floor ${f.id} · ${escapeHtml(f.name)}</b>
              <svg class="plan" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
                <rect x="0.4" y="0.4" width="${W-0.8}" height="${H-0.8}" rx="1.5" fill="none" stroke="#142231" stroke-width="0.4"/>
                ${cells}
              </svg>
              ${escapeHtml(f.subtitle)}
            </div>`;
        }).join("");
        host.innerHTML = cards + `
          <div class="ident">
            <b>Aurora Medical Center</b>
            12 Lakeside Avenue<br/>
            ${escapeHtml(STAND_DATA.boardId)}
          </div>`;
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderTable();
        renderFooter();
      });
    </script>
  </body>
</html>
