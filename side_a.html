<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Белый Гриб — Сторона А</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Caveat:wght@600;700&family=Raleway:wght@300;500;600&display=swap" rel="stylesheet" />
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-family: 'Raleway', sans-serif;
      color: #fff;
    }

    .page {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ─── фоновое фото на всю страницу ─── */
    .bg-photo {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .bg-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ─── затемняющий оверлей ─── */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg,
          rgba(0, 0, 0, 0.35) 0%,
          rgba(0, 0, 0, 0.10) 35%,
          rgba(0, 0, 0, 0.10) 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
    }

    /* ─── золотая рамка ─── */
    .frame {
      position: absolute;
      inset: 24px;
      border: 2px solid rgba(212, 168, 67, 0.6);
      border-radius: 6px;
      z-index: 2;
      pointer-events: none;
    }

    /* ─── контент поверх фото ─── */
    .content {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 48px;
    }

    /* ─── верх ─── */
    .top {
      text-align: center;
    }

    .tagline {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* ─── центр ─── */
    .center {
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      opacity: 0.95;
    }

    .cafe-name {
      font-family: 'Playfair Display', serif;
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 3px;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #D4A843;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .gold-line {
      width: 80px;
      height: 2px;
      background: #D4A843;
      margin: 28px auto 0;
    }

    /* ─── низ ─── */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .hours {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.8;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .hours span {
      display: block;
    }

    .contact {
      text-align: right;
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.8;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .contact .phone {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #D4A843;
    }

    /* ─── печать ─── */
    @media print {
      .page {
        width: 210mm;
        height: 297mm;
      }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Фоновое фото -->
  <div class="bg-photo">
    <img
      src="https://res.cloudinary.com/dnickckih/image/upload/v1779201995/Gemini_Generated_Image_qwe4t9qwe4t9qwe4_xd8wrn.png"
      alt="Штендер кафе Белый Гриб — сторона А"
    />
  </div>

  <!-- Оверлей -->
  <div class="overlay"></div>

  <!-- Золотая рамка -->
  <div class="frame"></div>

  <!-- Контент -->
  <div class="content">

    <!-- Верх -->
    <div class="top">
      <p class="tagline">Добро пожаловать</p>
    </div>

    <!-- Центр -->
    <div class="center">
      <svg class="logo-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="40" cy="32" rx="30" ry="20" fill="rgba(255,255,255,0.9)"/>
        <rect x="33" y="32" width="14" height="26" rx="5" fill="rgba(255,255,255,0.75)"/>
        <ellipse cx="40" cy="58" rx="16" ry="4" fill="rgba(255,255,255,0.2)"/>
        <circle cx="28" cy="26" r="3.5" fill="#D4A843" opacity="0.4"/>
        <circle cx="46" cy="22" r="3" fill="#D4A843" opacity="0.35"/>
        <circle cx="36" cy="18" r="2.5" fill="#D4A843" opacity="0.3"/>
      </svg>
      <h1 class="cafe-name">Белый Гриб</h1>
      <p class="subtitle">уютное лесное кафе</p>
      <div class="gold-line"></div>
    </div>

    <!-- Низ -->
    <div class="bottom">
      <div class="hours">
        <span>Пн — Пт: 08:00 — 22:00</span>
        <span>Сб — Вс: 09:00 — 23:00</span>
      </div>
      <div class="contact">
        <span class="phone">+7 (495) 123-45-67</span>
        <span>ул. Лесная, д. 12 · Москва</span>
      </div>
    </div>

  </div>

</div>

</body>
</html>
