<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Белый Гриб — Сторона А</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Caveat:wght@600;700&family=Raleway:wght@300;500;600&display=swap" rel="stylesheet" />
  <style>
    @page {
      size: 600mm 1000mm;
      margin: 0;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ─── штендер-доска ─── */
    .shtender {
      width: 600px;
      height: 1000px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    @media (max-width: 640px) {
      .shtender {
        width: 100vw;
        height: calc(100vw * 1.6667);
        border-radius: 0;
      }
    }

    @media print {
      html, body { background: #fff; }
      .shtender {
        width: 600mm;
        height: 1000mm;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ─── фон ─── */
    .bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ─── оверлей ─── */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg,
          rgba(0,0,0,0.40) 0%,
          rgba(0,0,0,0.08) 30%,
          rgba(0,0,0,0.08) 55%,
          rgba(0,0,0,0.55) 100%
        );
    }

    /* ─── рамка ─── */
    .frame {
      position: absolute;
      inset: 20px;
      border: 2px solid rgba(212,168,67,0.55);
      border-radius: 8px;
      z-index: 2;
      pointer-events: none;
    }

    /* ─── контент ─── */
    .content {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 40px;
      color: #fff;
      font-family: 'Raleway', sans-serif;
    }

    /* ─── верх ─── */
    .top {
      text-align: center;
    }

    .top .tag {
      font-family: 'Caveat', cursive;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* ─── центр ─── */
    .center {
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 2px;
      text-shadow: 0 4px 24px rgba(0,0,0,0.4);
      margin-bottom: 14px;
    }

    .sub {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: #D4A843;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .line {
      width: 70px;
      height: 2px;
      background: #D4A843;
      margin: 32px auto 0;
    }

    /* ─── низ ─── */
    .bot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.8;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .bot .phone {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #D4A843;
    }

    .bot .right {
      text-align: right;
    }
  </style>
</head>
<body>

<div class="shtender">
  <div class="bg">
    <img src="https://res.cloudinary.com/dnickckih/image/upload/v1779201995/Gemini_Generated_Image_qwe4t9qwe4t9qwe4_xd8wrn.png" alt="Сторона А" />
  </div>
  <div class="overlay"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="top">
      <p class="tag">Добро пожаловать</p>
    </div>

    <div class="center">
      <svg class="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="40" cy="32" rx="30" ry="20" fill="rgba(255,255,255,0.9)"/>
        <rect x="33" y="32" width="14" height="26" rx="5" fill="rgba(255,255,255,0.75)"/>
        <ellipse cx="40" cy="58" rx="16" ry="4" fill="rgba(255,255,255,0.2)"/>
        <circle cx="28" cy="26" r="3.5" fill="#D4A843" opacity="0.4"/>
        <circle cx="46" cy="22" r="3" fill="#D4A843" opacity="0.35"/>
        <circle cx="36" cy="18" r="2.5" fill="#D4A843" opacity="0.3"/>
      </svg>
      <h1>Белый<br>Гриб</h1>
      <p class="sub">уютное лесное кафе</p>
      <div class="line"></div>
    </div>

    <div class="bot">
      <div>
        <span>Пн — Пт: 08:00 — 22:00</span><br>
        <span>Сб — Вс: 09:00 — 23:00</span>
      </div>
      <div class="right">
        <span class="phone">+7 (495) 123-45-67</span><br>
        <span>ул. Лесная, д. 12 · Москва</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
